[profile.default]
src = "contracts"
out = "contracts/out"
libs = ["node_modules", "lib"]
test = "contracts/test"
cache_path = "contracts/cache"
evm_version = "paris"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/"
]
