name: verify

# The gate that must be green before a merge.
#
# Both jobs probe for their project files first, so the workflow is honest on a
# commit that does not have them yet. The app is built with bun because that is
# what the Arc Studio sandbox uses and what bun.lock pins.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: forge test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Foundry project present?
        id: probe
        run: |
          if [ -f foundry.toml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "no foundry.toml, skipping"; fi

      - uses: oven-sh/setup-bun@v2
        if: steps.probe.outputs.found == 'true'
        with:
          bun-version: latest

      # OpenZeppelin comes from node_modules, which foundry.toml lists as a lib dir
      - name: install solidity dependencies
        if: steps.probe.outputs.found == 'true'
        run: |
          if [ -f bun.lock ]; then bun install --frozen-lockfile; else bun install; fi
          if [ ! -d lib/forge-std ]; then
            git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
          fi

      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.probe.outputs.found == 'true'

      - name: forge test
        if: steps.probe.outputs.found == 'true'
        run: forge test -vv

  app:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: App package present?
        id: probe
        run: |
          if [ -f package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "no package.json, skipping"; fi

      - uses: oven-sh/setup-bun@v2
        if: steps.probe.outputs.found == 'true'
        with:
          bun-version: latest

      - name: install
        if: steps.probe.outputs.found == 'true'
        run: |
          if [ -f bun.lock ]; then bun install --frozen-lockfile; else bun install; fi

      - name: typecheck
        if: steps.probe.outputs.found == 'true'
        run: bunx tsc --noEmit

      - name: build
        if: steps.probe.outputs.found == 'true'
        run: bun run build
